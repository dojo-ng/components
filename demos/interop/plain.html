<!doctype html>
<html lang="en-US" dir="ltr" data-dj-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Interop — plain HTML/JS host</title>
		<link rel="stylesheet" href="../../packages/theme/theme.css" />
		<link rel="stylesheet" href="shared/style.css" />
		<script type="importmap">
			{
				"imports": {
					"lit": "https://esm.sh/lit@3.3.0",
					"lit/": "https://esm.sh/lit@3.3.0/",
					"@dojo-ng/dojo-element": "../../packages/dojo-element/dist/index.js",
					"@dojo-ng/dojo-element/base-styles.js": "../../packages/dojo-element/dist/base-styles.js",
					"@dojo-ng/i18n": "../../packages/i18n/dist/index.js",
					"@dojo-ng/icon": "../../packages/icon/dist/index.js",
					"@dojo-ng/label": "../../packages/label/dist/index.js",
					"@dojo-ng/helper-text": "../../packages/helper-text/dist/index.js",
					"@dojo-ng/loading-indicator": "../../packages/loading-indicator/dist/index.js",
					"@dojo-ng/popup": "../../packages/popup/dist/index.js",
					"@dojo-ng/list": "../../packages/list/dist/index.js",
					"@dojo-ng/dnd": "../../packages/dnd/dist/index.js",
					"@dojo-ng/button": "../../packages/button/dist/index.js",
					"@dojo-ng/text-input": "../../packages/text-input/dist/index.js",
					"@dojo-ng/select": "../../packages/select/dist/index.js",
					"@dojo-ng/switch": "../../packages/switch/dist/index.js"
				}
			}
		</script>
	</head>
	<body>
		<div class="host">
			<div class="toolbar">
				<dj-button id="theme" kind="outlined">Toggle theme</dj-button>
				<label id="locale-label" for="locale">Locale</label>
				<select id="locale" class="locale-select">
					<option value="en-US">English</option>
					<option value="de-DE">Deutsch</option>
				</select>
				<span id="state" class="state">theme: light</span>
			</div>

			<!-- The mini-app: declarative dj-* markup; the script below fills the
			     options PROPERTY (rich data never rides an attribute string). -->
			<form id="signup" class="card">
				<h1 id="title">Member signup</h1>
				<dj-text-input id="name" name="name" label="Name" required></dj-text-input>
				<dj-select id="role" name="role" label="Role"></dj-select>
				<dj-switch id="newsletter" name="newsletter">Newsletter</dj-switch>
				<dj-button id="submit" type="submit">Sign up</dj-button>
				<pre id="output" class="output">(nothing submitted yet)</pre>
				<p id="sample" class="sample"></p>
				<p id="event" class="event">(no component event yet)</p>
			</form>
		</div>

		<script type="module" src="./plain.mjs"></script>
	</body>
</html>
